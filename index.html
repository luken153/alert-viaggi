<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16284b"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icona-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Viaggi"><title>Alert Viaggi</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><style id="stile">
:root{
  --bg:#f3efe6; --surface:#fffdf8; --surface-2:#f6f1e6; --ink:#15203a; --ink-2:#47526a; --muted:#6f7788;
  --line:#ddd5c6; --line-2:#cfc5b2; --band:#16284b; --band-2:#1f3663; --band-ink:#f6f3ec; --band-muted:#aab6cf;
  --sun:#f2b234; --sun-soft:#fbeec9; --sun-ink:#6a4700; --board:#0f1a30; --board-ink:#ffd36b;
  --ok:#11743a; --ok-soft:#dcefe2; --warn:#a4500c; --warn-soft:#fbe5d2; --bad:#b42318; --bad-soft:#fbe0dc;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --focus:#2a78d6; --shadow:0 1px 0 rgba(21,32,58,.05),0 8px 24px -14px rgba(21,32,58,.25);
  --r:14px; --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif; --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1322; --surface:#151f33; --surface-2:#1a263d; --ink:#edf0f6; --ink-2:#b9c2d3; --muted:#8d98ad;
  --line:#28354f; --line-2:#34435f; --band:#101d38; --band-2:#18294a; --band-ink:#f2f4f8; --band-muted:#9aa8c4;
  --sun:#f2b234; --sun-soft:#3a2f12; --sun-ink:#f6d27a; --board:#070d1a; --board-ink:#ffd36b;
  --ok:#4cc27e; --ok-soft:#11301f; --warn:#f0a35e; --warn-soft:#3a2614; --bad:#f2867c; --bad-soft:#3d1a17;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --focus:#7fb0f0; --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1322; --surface:#151f33; --surface-2:#1a263d; --ink:#edf0f6; --ink-2:#b9c2d3; --muted:#8d98ad;
  --line:#28354f; --line-2:#34435f; --band:#101d38; --band-2:#18294a; --band-ink:#f2f4f8; --band-muted:#9aa8c4;
  --sun:#f2b234; --sun-soft:#3a2f12; --sun-ink:#f6d27a; --board:#070d1a; --board-ink:#ffd36b;
  --ok:#4cc27e; --ok-soft:#11301f; --warn:#f0a35e; --warn-soft:#3a2614; --bad:#f2867c; --bad-soft:#3d1a17;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --focus:#7fb0f0; --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.7);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--band);z-index:30}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.carico{padding:40px 16px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- testata ---------- */
.testata{background:var(--band);color:var(--band-ink)}
.testata .wrap{padding-block:22px 18px;display:grid;gap:14px}
.riga-titolo{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.marchio{display:flex;align-items:center;gap:12px;min-width:0}
.marchio-ico{width:44px;height:44px;border-radius:12px;background:var(--sun);color:#16284b;display:grid;place-items:center;flex:none}
.marchio-ico svg{width:26px;height:26px}
.marchio h1{font-size:30px;font-weight:800}
.marchio p{color:var(--band-muted);font-size:14px}
.azioni{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;line-height:1.2;min-height:38px}
.btn:hover{border-color:var(--ink-2)}
.btn svg{width:16px;height:16px;flex:none}
.testata .btn{background:transparent;color:var(--band-ink);border-color:rgba(255,255,255,.28)}
.testata .btn:hover{border-color:rgba(255,255,255,.6)}
.testata .btn.on{background:var(--sun);color:#16284b;border-color:var(--sun)}
.btn.primario{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.piccolo{padding:5px 11px;min-height:32px;font-size:13px}
.btn.pericolo{color:var(--bad);border-color:var(--bad)}
.stato-controllo{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--band-muted)}
.stato-controllo b{color:var(--band-ink);font-weight:600}

/* tabellone partenze */
.tabellone{background:var(--board);border-radius:var(--r);padding:12px 14px 6px;color:#e9eefb;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.tab-titolo{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#93a2c4;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.08)}
.tab-righe{list-style:none;margin:0;padding:0}
.tab-riga{display:grid;grid-template-columns:4.6em minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);font-family:var(--mono);font-size:13px}
.tab-riga:last-child{border-bottom:0}
.tab-riga .q{color:#93a2c4}
.tab-riga .d{color:var(--board-ink);font-weight:700;letter-spacing:.04em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab-riga .d small{color:#c9d3ea;font-weight:500;letter-spacing:0;text-transform:none}
.tab-riga .p{text-align:right;white-space:nowrap;color:#e9eefb}
.tab-riga .st{grid-column:2 / 4;font-size:12px;color:#c9d3ea;display:flex;gap:8px;align-items:center}
.luce{width:8px;height:8px;border-radius:50%;background:#93a2c4;flex:none}
.luce.verde{background:#4cc27e}.luce.gialla{background:#ffd36b}.luce.rossa{background:#f2867c}.luce.blu{background:#7fb0f0}
@media (max-width:759px){.tab-riga .d small{display:none}}
@media (min-width:760px){
  .tab-riga{grid-template-columns:5em minmax(0,1.4fr) minmax(0,1fr) 8.5em}
  .tab-riga .st{grid-column:3;grid-row:1}
  .tab-riga .p{grid-column:4;grid-row:1}
}

/* avvisi */
.avvisi{display:grid;gap:8px}
.avviso{display:flex;gap:10px;align-items:flex-start;background:var(--band-2);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--band-ink)}
.avviso .ico{font-size:18px;line-height:1.3}
.avviso b{display:block;font-weight:700}
.avviso span{color:var(--band-muted)}
.avviso a{color:var(--band-ink)}
.nessun-avviso{font-size:14px;color:var(--band-muted)}

/* ---------- navigazione ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
.nav .wrap::-webkit-scrollbar{display:none}
.nav button{border:0;background:transparent;padding:8px 13px;border-radius:999px;font-weight:600;font-size:15px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.nav button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.nav button:hover:not([aria-selected="true"]){background:var(--surface-2)}

main{padding-block:22px 40px}
.pannello{display:grid;gap:22px}
.pannello > *,.carta,.offerte > *,.citta-carte > *,.passi > *{min-width:0}
.sez-titolo{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.sez-titolo h2{font-size:24px;font-weight:800}
.sez-titolo p{color:var(--ink-2);font-size:15px;max-width:65ch}
.occhiello{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.carta{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.carta h3{font-size:18px;font-weight:700}
.griglia{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.griglia > *{min-width:0}
.tile{display:grid;gap:4px;align-content:start}
.tile .val{font-family:var(--display);font-size:28px;font-weight:800;line-height:1.1}
.tile .sub{color:var(--ink-2);font-size:14px}
.nota{font-size:13px;color:var(--muted)}
.etichetta{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;line-height:1.3}
.etichetta.ok{background:var(--ok-soft);color:var(--ok)}
.etichetta.warn{background:var(--warn-soft);color:var(--warn)}
.etichetta.bad{background:var(--bad-soft);color:var(--bad)}
.etichetta.sun{background:var(--sun-soft);color:var(--sun-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- carta d'imbarco ---------- */
.passi{display:grid;gap:16px}
.pass{position:relative;display:grid;grid-template-columns:minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.pass.nascosto{opacity:.55}
.pass-top{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;padding:10px 18px;background:var(--band);color:var(--band-ink)}
.pass-top .mese{font-family:var(--mono);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px}
.pass-top .finestra{font-size:13px;color:var(--band-muted)}
.pass-top .etichetta{background:rgba(255,255,255,.12);color:var(--band-ink)}
.pass-top .etichetta.ok{background:#1f5b3a;color:#dff5e7}
.pass-top .etichetta.sun{background:var(--sun);color:#16284b}
.pass-top .etichetta.warn{background:#6b3a12;color:#ffe2c8}
.pass-corpo{padding:16px 18px 14px;display:grid;gap:12px;min-width:0}
.tratta{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-weight:700}
.tratta .iata{font-size:30px;letter-spacing:.02em;line-height:1}
.tratta .linea{flex:1;min-width:30px;height:2px;background:repeating-linear-gradient(90deg,var(--line-2) 0 6px,transparent 6px 11px);position:relative}
.tratta .linea svg{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);color:var(--ink-2);background:var(--surface);padding:0 2px}
.pass h3{font-size:22px;font-weight:800;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pass h3 small{font-family:var(--sans);font-size:14px;font-weight:500;color:var(--ink-2)}
.campi{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px 14px;margin:0}
.campi div{min-width:0}
.campi dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.campi dd{margin:2px 0 0;font-weight:600;font-size:14.5px}
.pass-stub{position:relative;padding:16px 18px 18px;border-top:2px dashed var(--line);background:var(--surface-2);display:grid;gap:10px;align-content:start;min-width:0}
.pass-stub::before,.pass-stub::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.pass-stub::before{left:-11px}.pass-stub::after{right:-11px}
.totale{display:grid;gap:2px}
.totale .val{font-family:var(--display);font-size:30px;font-weight:800;line-height:1.05}
.totale .sub{font-size:13px;color:var(--ink-2)}
.stack{display:flex;gap:2px;height:12px;border-radius:4px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%;min-width:3px}
.stack i:first-child{border-radius:4px 0 0 4px}.stack i:last-child{border-radius:0 4px 4px 0}
.c1{background:var(--s1)}.c2{background:var(--s2)}.c3{background:var(--s3)}.c4{background:var(--muted)}
.legenda{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:13.5px}
.legenda li{display:flex;align-items:center;gap:8px;justify-content:space-between}
.legenda li span:first-child{display:flex;align-items:center;gap:7px;color:var(--ink-2);min-width:0}
.legenda li b{font-weight:700;white-space:nowrap}
.pallino{width:10px;height:10px;border-radius:3px;flex:none}
.pass details{grid-column:1/-1;border-top:1px solid var(--line)}
.pass summary{cursor:pointer;padding:12px 18px;font-weight:600;font-size:14.5px;list-style:none;display:flex;align-items:center;gap:8px}
.pass summary::-webkit-details-marker{display:none}
.pass summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(-45deg);transition:transform .15s}
.pass details[open] summary::before{transform:rotate(45deg)}
.dentro{padding:0 18px 18px;display:grid;gap:16px}
.dentro .colonne{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.dentro h4{font-size:13px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:700}
.dentro p{font-size:15px;color:var(--ink-2);max-width:65ch}
.confronto{width:100%;border-collapse:collapse;font-size:14px}
.confronto td,.confronto th{padding:7px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.confronto th{font-weight:600;color:var(--ink-2)}
.confronto td:last-child{text-align:right;font-weight:700;white-space:nowrap;padding-left:10px}
.confronto tr.scelto th{color:var(--ink)}
.confronto tr.scelto td:last-child::after{content:" ✓";color:var(--ok)}
.link-rapidi{display:flex;flex-wrap:wrap;gap:8px}
.aggiornare{display:flex;gap:8px;align-items:flex-start;background:var(--sun-soft);color:var(--sun-ink);border-radius:10px;padding:9px 12px;font-size:14px}
.pass-azioni{display:flex;gap:8px;flex-wrap:wrap}
@media (min-width:860px){
  .pass{grid-template-columns:minmax(0,1fr) 330px}
  .pass-stub{border-top:0;border-left:2px dashed var(--line)}
  .pass-stub::before,.pass-stub::after{left:-11px;right:auto}
  .pass-stub::before{top:-11px}.pass-stub::after{top:auto;bottom:-11px}
}

/* ---------- grafici a barre ---------- */
.barre{display:grid;gap:9px}
.barra-riga{display:grid;grid-template-columns:minmax(84px,10em) minmax(0,1fr);gap:4px 12px;align-items:center;font-size:14px}
.barra-riga .nome{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra-riga .traccia{position:relative;display:flex;align-items:center;gap:8px;min-width:0}
.barra-riga .riempi{display:flex;gap:2px;height:16px;min-width:4px}
.barra-riga .riempi i{display:block;height:100%}
.barra-riga .riempi i:first-child{border-radius:4px 0 0 4px}
.barra-riga .riempi i:last-child{border-radius:0 4px 4px 0}
.barra-riga .riempi i:only-child{border-radius:0 4px 4px 0}
.barra-riga .v{font-size:13px;font-weight:700;white-space:nowrap}
.barra-riga.ref .nome{color:var(--ink-2)}
.barra-riga.ref .riempi i{background:var(--muted)}
.barra-riga .riempi i[data-tip]{cursor:default}
.legenda-oriz{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.legenda-oriz span{display:inline-flex;align-items:center;gap:6px}
.colonne-graf{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:170px;position:relative;padding-top:18px;border-bottom:1px solid var(--line-2)}
.colonne-graf .col{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center}
.colonne-graf .col i{display:block;width:100%;max-width:34px;border-radius:4px 4px 0 0;background:var(--line-2)}
.colonne-graf .col.estate i{background:var(--s1)}
.colonne-graf .col b{position:absolute;bottom:calc(var(--h) + 3px);font-size:11px;font-weight:700;white-space:nowrap}
.assi-mesi{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;font-size:11px;color:var(--muted);text-align:center;margin-top:5px}
.soglia{position:absolute;left:0;right:0;border-top:1.5px solid var(--bad);z-index:1}
.soglia span{position:absolute;right:0;top:-18px;font-size:11px;font-weight:700;color:var(--bad);background:var(--surface);padding:0 4px}
@media (max-width:520px){.colonne-graf .col b{display:none}.colonne-graf .col.estate b{display:block}}

/* linea del tempo NY */
.tempo{position:relative;height:56px;margin:8px 0 4px}
.tempo .asse{position:absolute;left:0;right:0;top:24px;height:8px;border-radius:4px;background:var(--line)}
.tempo .fin{position:absolute;top:24px;height:8px;border-radius:4px;background:var(--ok)}
.tempo .marca{position:absolute;top:12px;width:2px;height:32px;background:var(--ink)}
.tempo .marca span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;white-space:nowrap}
.tempo .marca.parti{background:var(--s2)}
.tempo .marca.fine span{transform:translateX(-100%)}
.tempo-et{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.semaforo{display:flex;gap:14px;align-items:flex-start}
.semaforo .luci{display:grid;gap:5px;background:var(--board);padding:7px;border-radius:12px;flex:none}
.semaforo .luci i{width:18px;height:18px;border-radius:50%;background:#26324a}
.semaforo .luci i.on.r{background:#f2867c}.semaforo .luci i.on.g{background:#ffd36b}.semaforo .luci i.on.v{background:#4cc27e}

/* tabelle */
.tab-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.dati{border-collapse:collapse;width:100%;font-size:14px;min-width:620px}
table.dati th,table.dati td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.dati thead th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface-2);position:sticky;top:0}
table.dati td.n,table.dati th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.dati tr:last-child td{border-bottom:0}
table.dati tr.roma td{background:var(--surface-2);font-weight:600}

/* offerte e promo */
.offerte{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.offerta{display:grid;gap:8px;align-content:start}
.offerta .prezzo{font-family:var(--display);font-size:26px;font-weight:800;line-height:1}
.offerta .prezzo small{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink-2)}
.offerta .riga{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.filtro{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filtro label{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.promo{display:grid;gap:8px;border-left:4px solid var(--line-2)}
.promo.attiva{border-left-color:var(--ok)}
.promo.arrivo{border-left-color:var(--sun)}
.promo .titolo{font-weight:700;font-size:16px}

/* città */
.citta-carte{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.citta-carta{display:grid;gap:10px;align-content:start}
.citta-carta .testa{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.citta-carta h3{font-size:19px}
.voci{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;margin:0}
.voci dt{color:var(--ink-2)}
.voci dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.diff{font-weight:700}
.diff.giu{color:var(--ok)}.diff.su{color:var(--bad)}

/* calendario */
.cal{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.cal li{display:grid;grid-template-columns:10.5em minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14.5px}
.cal li .q{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
@media (max-width:560px){.cal li{grid-template-columns:minmax(0,1fr) auto}.cal li .q{grid-column:1/-1}}

/* piede */
.piede{border-top:1px solid var(--line);padding-block:24px 40px;color:var(--ink-2);font-size:14px}
.piede .wrap{display:grid;gap:16px}
.piede h3{font-size:16px;color:var(--ink)}
.piede ul{margin:0;padding-left:18px;display:grid;gap:4px}
.piede code{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:5px}

/* dialoghi, avvisi temporanei, tooltip */
dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(8,13,26,.55)}
.modulo{display:grid;gap:14px;padding:20px}
.modulo h2{font-size:22px}
.modulo .due{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.campo{display:grid;gap:5px}
.campo span{font-size:13px;font-weight:600;color:var(--ink-2)}
.campo input,.campo select,.campo textarea{width:100%;border:1px solid var(--line-2);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:15px;min-height:42px}
.campo textarea{min-height:70px;resize:vertical}
.campo small{font-size:12px;color:var(--muted)}
.modulo .piede-modulo{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding-top:6px;border-top:1px solid var(--line)}
.modulo .piede-modulo div{display:flex;gap:8px;flex-wrap:wrap}
.errore{color:var(--bad);font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100vw - 32px);box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.velo{position:fixed;inset:0;background:rgba(8,13,26,.45);display:grid;place-items:center;z-index:70}
.velo div{background:var(--surface);color:var(--ink);padding:18px 22px;border-radius:14px;font-weight:700}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;font-weight:600;padding:6px 9px;border-radius:8px;max-width:240px;box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--sun-soft);color:var(--sun-ink);border-radius:12px;padding:10px 14px;font-size:14px}

/* copia scaricata */
.copia .nav,.copia .solo-live{display:none!important}
.copia .pannello{margin-bottom:34px}
@media print{.nav,.azioni{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
